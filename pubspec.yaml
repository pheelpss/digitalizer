name: digitalizer
description: Experimento offline de leitura dos relatórios 5S da Ondexa.
publish_to: none
version: 0.1.5+6
environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: '>=3.35.0'
dependencies:
  flutter:
    sdk: flutter
  google_mlkit_text_recognition: 0.17.1
  image_picker: 1.2.4
  image: 4.12.0
  path_provider: 2.1.5
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/catalog.json
    - assets/digits.bin
    - assets/model_metrics.json
